backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "notices"
    label: "公告與會議紀錄"
    files:
      - file: "data/notices.json"
        name: "notices"
        label: "公告清單"
        fields:
          - label: "公告 / 會議紀錄項目"
            name: "items"
            widget: "list"
            summary: "{{fields.date}}｜{{fields.title}}"
            fields:
              - { label: "日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: "類別", name: "tag", widget: "select", options: ["公告", "會議"] }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "發布單位", name: "unit", widget: "string" }
              - { label: "文件連結網址（選填）", name: "pdfUrl", widget: "string", required: false }
